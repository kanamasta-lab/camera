<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5e9df"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Cozy Lens ♡</title>
<style>
:root{--bg:#f6eee7;--card:#fffaf5;--ink:#5a4036;--muted:#9a7c70;--line:#ead9cc;--accent:#c98e79;--shadow:0 14px 40px #7a58401c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#fff9f3 0,transparent 35%),var(--bg);font-family:Georgia,'Times New Roman',serif;color:var(--ink);min-height:100vh}button,input{font:inherit}.app{width:min(100%,520px);min-height:100vh;margin:auto;padding:16px 14px 22px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:5px 4px 12px}.brand{font-size:25px;font-weight:700;letter-spacing:-.5px}.brand small{display:block;font:12px Arial,sans-serif;color:var(--muted);letter-spacing:.5px;margin-top:2px}.icon{width:42px;height:42px;border:1px solid var(--line);background:#fffaf6;border-radius:50%;color:var(--ink);box-shadow:var(--shadow);cursor:pointer}.view{display:none;flex:1}.view.active{display:flex;flex-direction:column}.camera{position:relative;aspect-ratio:3/4;border-radius:30px;overflow:hidden;background:#d8c6b7;box-shadow:var(--shadow);border:1px solid #ead9cd}.camera video,.camera .fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.fallback{display:flex;align-items:center;justify-content:center;text-align:center;padding:35px;background:linear-gradient(135deg,#e8d5c5,#f9eee5);color:#806558}.fallback strong{font-size:19px}.grid{position:absolute;inset:0;background:linear-gradient(90deg,transparent 32.9%,#fff8 33%,transparent 33.2%,transparent 66.4%,#fff8 66.5%,transparent 66.7%),linear-gradient(0deg,transparent 32.9%,#fff8 33%,transparent 33.2%,transparent 66.4%,#fff8 66.5%,transparent 66.7%);pointer-events:none}.layer{position:absolute;left:50%;top:50%;width:55%;max-height:65%;object-fit:contain;transform:translate(-50%,-50%) scale(1);opacity:.45;touch-action:none;user-select:none}.layer.locked{pointer-events:none}.pillrow{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:8px;justify-content:space-between}.pill{border:1px solid #fff9;background:#fff9f2e8;padding:9px 12px;border-radius:18px;color:var(--ink);font:13px Arial,sans-serif;backdrop-filter:blur(8px)}.controls{padding:14px 5px 0}.zoom{display:flex;justify-content:center;gap:8px;margin-bottom:13px}.zoom button,.filter{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:18px;cursor:pointer}.zoom button.active{background:#fff8f2;color:var(--ink);box-shadow:0 5px 18px #6c493322}.captureRow{display:flex;align-items:center;justify-content:space-between}.round{width:62px;height:62px;border-radius:50%;border:2px solid var(--ink);background:#fffaf5;box-shadow:0 0 0 7px #fff4eb;cursor:pointer}.round:active{transform:scale(.96)}.smallActions{display:flex;gap:8px}.smallActions button{width:43px;height:43px;border-radius:50%;border:1px solid var(--line);background:#fff9f4;cursor:pointer;color:var(--ink)}.tools{display:flex;gap:8px;overflow:auto;margin-top:15px;padding-bottom:3px}.tool{white-space:nowrap;border:1px solid var(--line);background:#fff9f4;border-radius:18px;padding:9px 12px;color:var(--ink);cursor:pointer;font-size:13px}.tool.active{border-color:var(--accent);background:#f7e5da}.range{width:100%;accent-color:var(--accent)}.panel{background:#fffaf5;border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:var(--shadow);margin-top:8px}.panel h2{margin:0 0 14px;font-size:23px}.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.swatch{aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 3px 12px #6d493322;cursor:pointer}.swatch.active{outline:2px solid var(--ink);outline-offset:3px}.presetrow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:15px}.preset{border:1px solid var(--line);background:#fff5ee;border-radius:16px;padding:10px 4px;font-size:11px;color:var(--ink);cursor:pointer}.lightbox{min-height:430px;border-radius:30px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);border:1px solid #ead9cc;transition:background .2s}.lightbox span{background:#fff9f1cc;padding:10px 14px;border-radius:20px;font-size:13px}.label{font:12px Arial,sans-serif;color:var(--muted);margin:15px 0 7px}.nav{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:18px}.nav button{border:1px solid var(--line);background:#fff9f4;border-radius:22px;padding:13px;color:var(--muted);cursor:pointer}.nav button.active{background:#f0ddd0;color:var(--ink);border-color:#dfc0ad}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.thumb{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1;border:1px solid var(--line);background:#eadcd2}.thumb img{width:100%;height:100%;object-fit:cover}.heart{position:absolute;right:7px;top:7px;border:0;background:#fff9;border-radius:50%;width:34px;height:34px;cursor:pointer}.empty{padding:30px;text-align:center;color:var(--muted);background:#fff9f4;border-radius:22px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(15px);background:#5a4036;color:#fffaf5;padding:10px 15px;border-radius:20px;font:13px Arial,sans-serif;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand">Cozy Lens ♡<small>capture doucement, crée librement</small></div><button class="icon" id="galleryBtn">♡</button></header>
<section id="cameraView" class="view active"><div class="camera" id="cameraBox"><video id="video" autoplay playsinline muted></video><div class="fallback" id="fallback"><div><strong>Ta caméra t'attend ♡</strong><br><br>Appuie sur le bouton appareil pour l'activer.</div></div><div class="grid" id="grid" style="display:none"></div><img id="layer" class="layer" hidden><div class="pillrow"><button class="pill" id="flashBtn">✦ Flash auto</button><button class="pill" id="switchBtn">↻ Caméra</button></div></div>
<div class="controls"><div class="zoom"><button data-zoom="0.5">0.5×</button><button data-zoom="1" class="active">1×</button><button data-zoom="2">2×</button></div><div class="captureRow"><div class="smallActions"><button id="gridBtn">▦</button><button id="timerBtn">◷</button></div><button class="round" id="capture">●</button><div class="smallActions"><button id="layerBtn">▧</button><button id="lockBtn">♧</button></div></div><input type="file" id="file" accept="image/*" hidden><div class="tools"><button class="tool" id="removeLayer">Retirer calque</button><button class="tool" id="filterBtn">Filtre: Naturelle</button><button class="tool" id="clearGallery">Effacer galerie</button></div><div id="filterPanel" class="panel" hidden><div class="label">Choisis ton mood</div><div class="tools"><button class="filter" data-filter="none">Naturelle</button><button class="filter" data-filter="cream">Crème</button><button class="filter" data-filter="vintage">Vintage</button><button class="filter" data-filter="blush">Blush</button><button class="filter" data-filter="moody">Moody</button></div></div></div></section>
<section id="lightView" class="view"><div class="lightbox" id="lightbox"><span>♡ lumière douce</span></div><div class="panel"><h2>Lumière</h2><div class="label">Couleur</div><div class="swatches" id="swatches"></div><div class="label">Intensité <b id="intensityText">80%</b></div><input class="range" id="intensity" type="range" min="10" max="100" value="80"><div class="label">Température <b id="tempText">4500K</b></div><input class="range" id="temp" type="range" min="2500" max="6500" value="4500"><div class="presetrow"><button class="preset" data-preset="candle">🕯️<br>Bougie</button><button class="preset" data-preset="warm">☀️<br>Chaude</button><button class="preset" data-preset="neutral">○<br>Neutre</button><button class="preset" data-preset="cool">❄️<br>Froide</button><button class="preset" data-preset="rainbow">🌈<br>Arc-en-ciel</button></div><div class="tools"><button class="tool" id="torchBtn">☼ Activer le flash du téléphone</button></div></div></section>
<section id="galleryView" class="view"><div class="panel"><h2>Mes photos ♡</h2><div id="gallery" class="gallery"></div></div></section>
<nav class="nav"><button id="cameraNav" class="active">📷 Appareil</button><button id="lightNav">💡 Lumière</button></nav><div class="toast" id="toast"></div>
</main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let stream=null,facing='environment',zoom=1,flash=false,timer=0,layerLocked=false,filter='none';
const colors=['#ff6f61','#ffad4d','#ffd86b','#b9d985','#8edbd7','#83a9e8','#b889e9','#ed79bb','#f7b6b6','#fffaf5','#d8b6ff','#f5c28b'];
const swatches=$('#swatches');colors.forEach((c,i)=>{let b=document.createElement('button');b.className='swatch'+(i===9?' active':'');b.style.background=c;b.onclick=()=>{ $$('.swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');lightColor=c;updateLight()};swatches.appendChild(b)});let lightColor=colors[9];
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:false});$('#video').srcObject=stream;$('#fallback').style.display='none';await applyZoom()}catch(e){$('#fallback').style.display='flex';toast('Autorise la caméra pour utiliser l’appareil ♡')}}
async function applyZoom(){let track=stream?.getVideoTracks()[0];if(!track)return;let caps=track.getCapabilities?.();if(caps?.zoom){let z=Math.max(caps.zoom.min,Math.min(caps.zoom.max,zoom));try{await track.applyConstraints({advanced:[{zoom:z}]})}catch(e){}}else{$('#video').style.transform=`scale(${zoom})`}}
$('#switchBtn').onclick=()=>{facing=facing==='environment'?'user':'environment';startCamera()};$('#capture').onclick=()=>{if(!stream)return startCamera();if(timer){toast('Photo dans 3 secondes…');setTimeout(takePhoto,3000)}else takePhoto()};
function takePhoto(){let v=$('#video'),c=document.createElement('canvas');c.width=v.videoWidth||1080;c.height=v.videoHeight||1440;let ctx=c.getContext('2d');ctx.filter=cssFilter(filter);ctx.drawImage(v,0,0,c.width,c.height);let a=document.createElement('a');a.href=c.toDataURL('image/jpeg',.92);savePhoto(a.href);toast('Photo enregistrée ♡')}
function cssFilter(f){return f==='cream'?'sepia(.18) saturate(.82) brightness(1.06)':f==='vintage'?'sepia(.42) contrast(.9) saturate(.8)':f==='blush'?'sepia(.12) saturate(1.25) hue-rotate(330deg)':f==='moody'?'contrast(1.08) saturate(.78) brightness(.82)':'none'}
function savePhoto(src){let arr=JSON.parse(localStorage.getItem('cozyPhotos')||'[]');arr.unshift({src,fav:false,id:Date.now()});localStorage.setItem('cozyPhotos',JSON.stringify(arr));renderGallery()}
function renderGallery(){let g=$('#gallery'),arr=JSON.parse(localStorage.getItem('cozyPhotos')||'[]');if(!arr.length){g.innerHTML='<div class="empty">Aucune photo pour le moment ♡<br>Prends ton premier petit cliché.</div>';return}g.innerHTML=arr.map(p=>`<div class="thumb"><img src="${p.src}"><button class="heart" data-id="${p.id}">${p.fav?'♥':'♡'}</button></div>`).join('');$$('.heart').forEach(b=>b.onclick=()=>{let a=JSON.parse(localStorage.getItem('cozyPhotos')||'[]'),p=a.find(x=>x.id==b.dataset.id);p.fav=!p.fav;localStorage.setItem('cozyPhotos',JSON.stringify(a));renderGallery()})}
$('#galleryBtn').onclick=()=>show('gallery');$('#clearGallery').onclick=()=>{if(confirm('Effacer toutes les photos ?')){localStorage.removeItem('cozyPhotos');renderGallery();toast('Galerie effacée')}};
function show(name){$$('.view').forEach(v=>v.classList.remove('active'));$('#'+name+'View').classList.add('active');if(name==='gallery')renderGallery();$('#cameraNav').classList.toggle('active',name==='camera');$('#lightNav').classList.toggle('active',name==='light')}
$('#cameraNav').onclick=()=>show('camera');$('#lightNav').onclick=()=>show('light');
$$('[data-zoom]').forEach(b=>b.onclick=()=>{$$('[data-zoom]').forEach(x=>x.classList.remove('active'));b.classList.add('active');zoom=+b.dataset.zoom;applyZoom()});
$('#gridBtn').onclick=()=>{$('#grid').style.display=$('#grid').style.display==='none'?'block':'none'};$('#timerBtn').onclick=()=>{timer=timer?0:3;toast(timer?'Minuteur: 3s':'Minuteur désactivé')};$('#flashBtn').onclick=()=>{flash=!flash;$('#flashBtn').textContent=flash?'✦ Flash activé':'✦ Flash auto';let t=stream?.getVideoTracks()[0];let c=t?.getCapabilities?.();if(c?.torch)t.applyConstraints({advanced:[{torch:flash}]})};
$('#layerBtn').onclick=()=>$('#file').click();$('#file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{$('#layer').src=r.result;$('#layer').hidden=false;layerLocked=false;$('#lockBtn').textContent='♧';};r.readAsDataURL(f)};$('#removeLayer').onclick=()=>{$('#layer').hidden=true};$('#lockBtn').onclick=()=>{layerLocked=!layerLocked;$('#layer').classList.toggle('locked',layerLocked);$('#lockBtn').textContent=layerLocked?'🔒':'♧';toast(layerLocked?'Calque verrouillé':'Calque déverrouillé')};
let dragging=false,sx=0,sy=0,ox=0,oy=0,scale=1;const layer=$('#layer');layer.addEventListener('pointerdown',e=>{if(layerLocked)return;dragging=true;layer.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY});layer.addEventListener('pointermove',e=>{if(!dragging)return;ox+=e.clientX-sx;oy+=e.clientY-sy;sx=e.clientX;sy=e.clientY;layer.style.transform=`translate(calc(-50% + ${ox}px),calc(-50% + ${oy}px)) scale(${scale})`});layer.addEventListener('pointerup',()=>dragging=false);layer.addEventListener('wheel',e=>{if(layerLocked)return;e.preventDefault();scale=Math.max(.3,Math.min(3,scale+(e.deltaY<0?.1:-.1)));layer.style.transform=`translate(calc(-50% + ${ox}px),calc(-50% + ${oy}px)) scale(${scale})`},{passive:false});
$('#filterBtn').onclick=()=>$('#filterPanel').hidden=!$('#filterPanel').hidden;$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$('#filterBtn').textContent='Filtre: '+b.textContent;$('#video').style.filter=cssFilter(filter)});
function updateLight(){let i=+$('#intensity').value/100;let c=lightColor;if(c==='#fffaf5'){let k=+$('#temp').value;let warm=Math.max(0,Math.min(1,(4500-k)/2000));c=`rgb(${Math.round(255)},${Math.round(250-70*warm)},${Math.round(245-90*warm)})`}$('#lightbox').style.background=c;$('#lightbox').style.filter=`brightness(${.55+i*.55})`;$('#intensityText').textContent=Math.round(i*100)+'%'}$('#intensity').oninput=updateLight;$('#temp').oninput=()=>{$('#tempText').textContent=$('#temp').value+'K';updateLight()};
$$('[data-preset]').forEach(b=>b.onclick=()=>{let p=b.dataset.preset;let map={candle:['#ff9b4a',70,2800],warm:['#ffd08a',85,3300],neutral:['#fffaf5',80,4500],cool:['#b7d7ff',75,6000],rainbow:['#d7a8ff',90,4500]};let [c,i,t]=map[p];lightColor=c;$('#intensity').value=i;$('#temp').value=t;$('#tempText').textContent=t+'K';$$('.swatch').forEach(x=>x.classList.remove('active'));updateLight()});
$('#torchBtn').onclick=async()=>{let t=stream?.getVideoTracks()[0],cap=t?.getCapabilities?.();if(cap?.torch){try{let on=!$('#torchBtn').dataset.on;t.applyConstraints({advanced:[{torch:on}]});$('#torchBtn').dataset.on=on;$('#torchBtn').textContent=on?'☼ Flash du téléphone activé':'☼ Activer le flash du téléphone'}catch(e){toast('Flash non disponible')}}else toast('Le navigateur ne permet pas le vrai flash ici')};
renderGallery();updateLight();if(navigator.mediaDevices?.getUserMedia)startCamera();else toast('Caméra non disponible dans ce navigateur');
</script></body></html>
